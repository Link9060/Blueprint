name: Blueprint CI
on:
  push:
    branches:
      - "build/**"
      - "feature/**"
      - "fix/**"
      - main
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax checks
        run: |
          node --check site/app.js
          node --check site/data.js
          node --check site/supabase.js
          node --check site/config.js
          node --check site/roles.js
          node --check site/profile.js
      - name: Run unit and schema tests
        run: node --test tests/data.test.mjs tests/render.test.mjs tests/roles.test.mjs tests/layout.test.mjs tests/profile.test.mjs
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: blueprint_ci_only
          POSTGRES_DB: blueprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blueprint_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: blueprint_ci_only
      PGDATABASE: blueprint_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare simulated Supabase auth
        run: psql -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
      - name: Apply Blueprint schema
        run: psql -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Apply Blueprint v2 extensions
        run: psql -v ON_ERROR_STOP=1 -f database/upgrade_v2.sql
      - name: Apply protected Owner hierarchy
        run: psql -v ON_ERROR_STOP=1 -f database/upgrade_v3_owner.sql
      - name: Apply team editing and profile permissions
        run: psql -v ON_ERROR_STOP=1 -f database/upgrade_v4_edit_profiles.sql
      - name: Apply moderation and engineering schema
        run: psql -v ON_ERROR_STOP=1 -f database/upgrade_v5_team_safety_engineering.sql
      - name: Verify team isolation and permissions
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/security.sql
          psql -v ON_ERROR_STOP=1 -f tests/edit_profiles_security.sql
          psql -v ON_ERROR_STOP=1 -f tests/moderation_engineering_security.sql
