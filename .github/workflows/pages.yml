name: Publish Blueprint
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check site/app.js
          node --check site/data.js
          node --check site/supabase.js
          node --check site/config.js
          node --check site/roles.js
          node --check site/profile.js
          node --check site/engineering.js
          node --check site/planning.js
          node --check site/coordination.js
      - name: Test workspace data boundaries
        run: node --test tests/data.test.mjs tests/render.test.mjs tests/roles.test.mjs tests/layout.test.mjs tests/profile.test.mjs tests/engineering.test.mjs tests/planning.test.mjs tests/coordination.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
